name: Rebuild package index

on:
  schedule:
    # First of every month at 06:00 UTC — keeps the signer identity pin in
    # core/index_download.py stable (refs/heads/main).
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      top_n:
        description: Per-ecosystem override (blank = calibrated DEFAULT_TOP_N)
        default: ""

permissions:
  id-token: write  # required for sigstore keyless signing (assemble job)
  contents: read

concurrency:
  # Serialize overlapping rebuilds; queue rather than cancel so in-flight
  # embed work on prior dispatches isn't discarded.
  group: rebuild-index
  cancel-in-progress: false

jobs:
  build-shard:
    runs-on: ubuntu-latest
    # Snapshot download (~few hundred MB) + CPU embed pass; individual shards
    # finish well under this in normal operation.
    timeout-minutes: 120
    env:
      # Read access to the snapshot dataset; private repos would require this
      # but priorart/package-snapshot is public, so it's only needed for
      # higher rate limits during the initial download.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The largest snapshot download trips HF Hub's 429 under load; the 10s
      # defaults are too aggressive. Raise them and lean on fetch.py's backoff.
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "30"
    strategy:
      fail-fast: false
      # Cap concurrency so the six shard jobs don't fire their HF Hub snapshot
      # downloads in the same instant and trip the dataset's 429 rate limit.
      # Spreading them across waves keeps each request burst small.
      max-parallel: 2
      matrix:
        ecosystem: [python, npm, crates, go, maven, nuget]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastembed usearch numpy httpx 'huggingface_hub>=1.2.0'

      - name: Build ${{ matrix.ecosystem }} shard
        env:
          # Blank on schedule and default dispatch -> build.py omits --top-n and
          # uses the per-ecosystem calibrated DEFAULT_TOP_N. A non-empty value
          # is an intentional global override across all ecosystems.
          TOP_N: ${{ github.event.inputs.top_n }}
          # ONNX/OpenMP thread hints; ignored when the onnxruntime wheel is
          # not built with OpenMP.
          OMP_NUM_THREADS: "4"
          OMP_WAIT_POLICY: PASSIVE
        run: |
          python -m scripts.index_build.build \
            --ecosystem ${{ matrix.ecosystem }} \
            --out dist/index \
            ${TOP_N:+--top-n "$TOP_N"}

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.ecosystem }}
          path: dist/index/
          retention-days: 7
          if-no-files-found: error

  assemble-and-publish:
    needs: build-shard
    # Publish only when every shard rebuilt successfully. The matrix always
    # builds all six ecosystems (no selective-rebuild path), and `fail-fast:
    # false` lets every leg finish, so `result == 'success'` is true iff all six
    # succeeded — a single failed shard blocks publish rather than shipping a
    # stale shard for that ecosystem.
    if: ${{ needs.build-shard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_REPO_ID: priorart/package-index
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publish dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub>=1.2.0' sigstore

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: dist/index
          merge-multiple: true

      - name: Assemble manifest
        run: |
          python -m scripts.index_build.build \
            --assemble \
            --ecosystems python,npm,crates,go,maven,nuget \
            --out dist/index

      - name: Write README to disable HF dataset viewer
        # The repo holds heterogeneous artifacts (manifest.json, .usearch
        # binaries, per-ecosystem metadata.jsonl) and isn't loadable via
        # `datasets.load_dataset`. The viewer's auto-schema inference picks
        # one shape and 500s on the others; disable it.
        run: |
          cat > dist/index/README.md <<'EOF'
          ---
          viewer: false
          ---

          # priorart package index

          Sigstore-signed HNSW shards consumed by the [priorart](https://github.com/akshatvasisht/prior-art) CLI / MCP server.

          Files in this repo are not designed for `datasets.load_dataset`. The
          consumer fetches per-file via `huggingface_hub.hf_hub_download` and
          verifies `manifest.sigstore.json` against a pinned GitHub Actions
          OIDC signer identity before reading any shard.

          - `manifest.json` — build metadata, sha256-keyed shard index.
          - `manifest.sigstore.json` — sigstore bundle for the manifest.
          - `{ecosystem}.usearch` — int8 HNSW shard.
          - `{ecosystem}.metadata.jsonl` — `key` → record sidecar.
          EOF

      - name: Sign manifest with sigstore (keyless, GH OIDC)
        run: |
          sigstore sign \
            --bundle dist/index/manifest.sigstore.json \
            dist/index/manifest.json

      - name: Upload to Hugging Face Hub
        run: |
          python - <<'PY'
          import os
          import random
          import time

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]


          def _with_retry(label, fn, *, attempts=4, base_delay=5.0):
              # Mirror the build-side _hf_download_with_retry backoff: a transient
              # HF Hub 429 on create_repo / upload_folder must not discard a full
              # six-shard build at the final publish step.
              for attempt in range(attempts):
                  try:
                      return fn()
                  except Exception as e:
                      if attempt == attempts - 1:
                          raise
                      delay = base_delay * 2**attempt + random.uniform(0, base_delay)
                      print(
                          f"{label} failed (attempt {attempt + 1}/{attempts}): "
                          f"{e}; retrying in {delay:.0f}s",
                          flush=True,
                      )
                      time.sleep(delay)


          _with_retry(
              "create_repo",
              lambda: api.create_repo(repo_id, repo_type="dataset", exist_ok=True, private=False),
          )
          _with_retry(
              "upload_folder",
              lambda: api.upload_folder(
                  folder_path="dist/index",
                  repo_id=repo_id,
                  repo_type="dataset",
                  commit_message=f"Rebuild index {os.environ.get('GITHUB_SHA', '')[:7]}",
              ),
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-build-output
          path: dist/index

  notify-failure:
    needs: [build-shard, assemble-and-publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue when the rebuild fails
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Index rebuild failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled index rebuild did not publish. Run: $RUN_URL"
